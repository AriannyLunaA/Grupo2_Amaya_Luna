server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true


      server:
        webmvc:
          routes:
            - id: ms-auth
              uri: lb://ms-auth
              predicates:
                - Path=/api/v1/auth/**
            - id: ms-personas
              uri: lb://ms-persona
              predicates:
                - Path=/api/v1/personas/**
            - id: ms-equipo
              uri: lb://ms-equipo
              predicates:
                - Path=/api/v1/equipo/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true