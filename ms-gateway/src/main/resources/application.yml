server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true


      server:
        webmvc:
          routes:
            - id: ms-auth
              uri: lb://ms-auth
              predicates:
                - Path=/api/v1/auth/**
            - id: ms-persona
              uri: lb://ms-persona
              predicates:
                - Path=/api/v1/personas/**
            - id: ms-equipo
              uri: lb://ms-equipo
              predicates:
                - Path=/api/v1/equipo/**
            - id: ms-ticket
              uri: lb://ms-ticket
              predicates:
                - Path=/api/v1/ticket/**
            - id: ms-diagnostico
              uri: lb://ms-diagnostico
              predicates:
                - Path=/api/v1/diagnostico/**
            - id: ms-pago
              uri: lb://ms-pago
              predicates:
                - Path=/api/v1/pagos/**
            - id: ms-notificacion
              uri: lb://ms-notificacion
              predicates:
                - Path=/api/v1/notificaciones/**
            - id: ms-auditoria
              uri: lb://ms-auditoria
              predicates:
                - Path=/api/v1/auditoria/**
            - id: ms-inventario
              uri: lb://ms-inventario
              predicates:
                - Path=/api/v1/inventario/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Gateway-debug
logging:
  level:
    org.springframework.cloud.gateway: DEBUG