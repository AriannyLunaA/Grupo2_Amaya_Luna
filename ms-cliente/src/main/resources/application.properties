
# Nombre de la aplicación
spring.application.name=ms-cliente
# Puerto único para el ms Clientes
server.port=8082

# Configuración de MySQL (Creará la base de datos db_clientes automáticamente)

spring.datasource.url=jdbc:mysql://localhost:3306/db_clientes?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true